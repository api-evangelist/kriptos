aid: kriptos
name: Kriptos
description: Kriptos is an AI-driven unstructured data security platform that automatically discovers,
  classifies, and labels documents across endpoints, servers, and cloud storage, then feeds that business
  and risk context into the DLP, CASB, SIEM, EDR, and IAM tooling an organization already runs rather than
  replacing it. The platform spans data discovery and classification, data compliance and risk management,
  data access governance across Microsoft 365 and Google Workspace, insider threat management with UEBA,
  DSPM, and AI governance covering shadow-AI monitoring for tools such as Microsoft Copilot and Google
  Gemini. Classification results are written back as native Microsoft Purview and Google Drive labels.
  Founded in Ecuador and backed by Techstars, Kriptos reports more than 1.2 billion documents classified
  for over 150,000 users, with customers concentrated in banking, insurance, healthcare, and utilities
  across Latin America. Kriptos is a sales-led product and publishes no public API, developer portal, or
  machine-readable API documentation.
